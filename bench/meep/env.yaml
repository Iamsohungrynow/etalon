# The Meep benchmark environment. Meep is GPL-2.0-or-later: it lives only here, runs only as a
# subprocess (bench/run_meep_comparison.py), and nothing in etalon's environment imports it.
# Exact versions of every package are in env.lock.txt, exported after the first install.
#
#   micromamba create -y -n etalon-meep -f bench/meep/env.yaml
name: etalon-meep
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pymeep=1.35.0=mpi_mpich_*
  - mpi4py>=4.1
  - numpy>=2
  - pyyaml>=6
  - pydantic>=2.7
