# The public static demo of etalon Studio (docs/plan-demo.md): results recorded from
# real M0 runs, replayed in the browser, with no backend. Studio itself only ever
# serves 127.0.0.1; this file is for the demo build alone.
#
# studio/demo-data/ is not in git (28 MB of recorded arrays), so the demo is built
# locally and the folder deployed as is:
#   .venv/Scripts/python studio/scripts/record_demo.py
#   pnpm --dir studio build:demo
#   netlify deploy --no-build --dir studio/dist-demo [--prod]
[build]
  base = "studio"
  command = "pnpm build:demo"
  publish = "dist-demo"

# The SPA's routes (/sim/<id>/setup, /settings, ...) all load index.html. Files that
# exist, such as /assets/* and /demo-data/*, are served as they are.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The same policy the local Studio sends (etalon/studio/security.py): nothing but this
# origin, so no analytics, fonts or scripts from elsewhere.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
